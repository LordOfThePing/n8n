# n8n + Cloudflare Tunnel deployment
#
# Exposes the full n8n instance (editor UI + public API) at
# https://n8n.flynnpedroa.engineer via a Cloudflare Tunnel.
#
# This uses cloudflared's `--token` run mode: cloudflared connects to a tunnel
# created in the Cloudflare dashboard using its tunnel token (the `eyJ...`
# string). No API token, no credentials file, no cert.pem needed — just the
# tunnel token. The DNS route (public hostname) is configured in the dashboard.
#
# Prerequisites (see README.md in this folder):
#   - A tunnel created in Cloudflare (Networks -> Tunnels) with the token.
#   - A public hostname route for n8n.flynnpedroa.engineer -> http://localhost:5678
#     added to that tunnel (Networks -> Tunnels -> <tunnel> -> Public Hostnames).
#   - A populated .env file (copy .env.example -> .env).
#
# To start:   docker compose --env-file .env up -d
# To stop:    docker compose --env-file .env down

name: n8n-cloudflare

services:
  # ---- n8n backend -----------------------------------------------------------
  n8n:
    image: docker.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${N8N_LOCAL_PORT:-5678}:5678'
    environment:
      # Public URL: n8n binds to the path that Cloudflare hands off, so only
      # the hostname overrides are needed. WEBHOOK_URL is set explicitly so
      # generated webhook URLs point at the public host.
      N8N_HOST: n8n.flynnpedroa.engineer
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.flynnpedroa.engineer/
      N8N_PORT: '5678'
      # Encryption key for stored credentials — must stay constant across
      # restarts or stored credentials become unreadable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n

  # ---- Cloudflare Tunnel sidecar --------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    restart: unless-stopped
    # Share the n8n container's network namespace. The tunnel's dashboard route
    # is `http://localhost:5678`; with a shared namespace, `localhost` inside
    # cloudflared IS the n8n container, so that route resolves correctly.
    # No port mapping is needed here — cloudflared only makes outbound
    # connections to Cloudflare's edge.
    network_mode: service:n8n
    depends_on:
      - n8n
    # Runs the tunnel using its token from the TUNNEL_TOKEN environment
    # variable (the standard Cloudflare Docker pattern).
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}

volumes:
  n8n_data:
